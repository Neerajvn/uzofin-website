<!-- Company logos: intro line and logo row. -->
<section class="logos" aria-label="Companies">
  <!-- Intro line. -->
  <p>Powering tools and integration for companies around the world</p>
  <!-- Partner logos. -->
  <ul>
    @for (logo of logos; track logo.src) {
      <li>
        <img [src]="logo.src" [alt]="logo.alt" />
      </li>
    }
  </ul>
</section>
