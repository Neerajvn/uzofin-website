<button class="btn" [class.btn--outline]="variant() === 'outline'" [type]="type()">
  {{ text() }}
  <span class="arrow-slot" aria-hidden="true">
    <span class="arrow-track">
      @for (arrow of arrows; track arrow) {
        <svg viewBox="0 0 16 16">
          <path d="M2.5 8h10M9 4.5 12.5 8 9 11.5" />
        </svg>
      }
    </span>
  </span>
</button>
